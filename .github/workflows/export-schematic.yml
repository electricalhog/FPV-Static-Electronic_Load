name: Export Schematic PDF

on:
  push:
    paths:
      - 'hardware/electronic_load.kicad_sch'
      - 'hardware/build_schematic.py'
      - '.github/workflows/export-schematic.yml'
  pull_request:
    paths:
      - 'hardware/electronic_load.kicad_sch'
      - 'hardware/build_schematic.py'
  workflow_dispatch:

jobs:
  export-pdf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build schematic
        run: |
          uv run --python 3.12 --with "kicad-sch-api==0.5.6" \
            python hardware/build_schematic.py
        env:
          KICAD_SYMBOL_DIR: /usr/share/kicad/symbols

      - name: Export PDF
        run: |
          kicad-cli sch export pdf \
            --output hardware/electronic_load.pdf \
            hardware/electronic_load.kicad_sch

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: schematic-pdf
          path: hardware/electronic_load.pdf
          retention-days: 90

      - name: Commit updated schematic and PDF
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hardware/electronic_load.kicad_sch hardware/electronic_load.pdf
          git diff --cached --quiet || \
            git commit -m "ci: regenerate schematic PDF [skip ci]" && git push
