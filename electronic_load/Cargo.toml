[package]
name = "electronic_load"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7.5"
cortex-m-rt = "0.7.2"
embedded-hal = "1.0.0"
embedded-hal-0-2 = { package = "embedded-hal", version = "0.2.7" }
rp2040-hal = {version = "0.10.0", features = ["rt", "defmt", "critical-section-impl"]}
panic-halt = "0.2.0"
rotary-encoder-embedded = "0.3.0"

defmt-rtt = "0.4.0"
defmt = "0.3"
panic-probe = { version = "0.3", features = ["print-defmt"] }
rp2040-boot2 = "0.3.0"
